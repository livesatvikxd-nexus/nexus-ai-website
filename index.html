<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0b1020;
    color: #e8f0ff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  /* messages area */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 0.95rem;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: pop .25s ease both;
  }
  @keyframes pop { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }

  .user {
    align-self: flex-end;
    background: linear-gradient(135deg, #2f6bff, #7a3cff);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .ai {
    align-self: flex-start;
    background: #182444;
    border: 1px solid #263a6b;
    border-bottom-left-radius: 4px;
  }
  .ai.typing { color: #7fa3e0; font-style: italic; }

  /* composer */
  form {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #0f1730;
    border-top: 1px solid #1e2c52;
  }
  input {
    flex: 1;
    padding: 13px 16px;
    border-radius: 999px;
    border: 1px solid #263a6b;
    background: #0b1020;
    color: #e8f0ff;
    font-size: 0.95rem;
    outline: none;
  }
  input:focus { border-color: #4a7bff; }
  input::placeholder { color: #5a6f9e; }

  button {
    padding: 0 22px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #2f6bff, #7a3cff);
    color: #fff;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  /* welcome */
  .welcome {
    margin: auto;
    text-align: center;
    color: #6b82b8;
    font-size: 1rem;
    line-height: 1.7;
  }
</style>
</head>
<body>

<div id="log">
  <div class="welcome" id="welcome">Ask me anything.</div>
</div>

<form id="form" autocomplete="off">
  <input id="input" type="text" placeholder="Type your question…" autofocus>
  <button id="send" type="submit">Send</button>
</form>

<script>
const logEl   = document.getElementById('log');
const formEl  = document.getElementById('form');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');

let history = [];   // {role, content}
let busy = false;

function add(role, text) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  logEl.appendChild(el);
  logEl.scrollTop = logEl.scrollHeight;
  return el;
}

async function ask(question) {
  // build a single prompt from history + new question
  const prompt =
    "You are a helpful AI assistant. Answer clearly and accurately.\n\n" +
    history.map(m => (m.role === 'user' ? 'User: ' : 'AI: ') + m.content).join('\n') +
    (history.length ? '\n' : '') +
    'User: ' + question + '\nAI:';

  const url = 'https://text.pollinations.ai/' + encodeURIComponent(prompt);

  const res = await fetch(url, { method: 'GET' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = (await res.text()).trim();
  if (!text) throw new Error('Empty reply');
  return text;
}

formEl.addEventListener('submit', async e => {
  e.preventDefault();
  if (busy) return;

  const q = inputEl.value.trim();
  if (!q) return;

  inputEl.value = '';
  add('user', q);
  history.push({ role: 'user', content: q });

  busy = true;
  sendBtn.disabled = true;

  const thinking = add('ai', 'Thinking…');
  thinking.classList.add('typing');

  try {
    const answer = await ask(q);
    thinking.classList.remove('typing');
    thinking.textContent = answer;
    history.push({ role: 'ai', content: answer });
  } catch (err) {
    thinking.classList.remove('typing');
    thinking.textContent = '⚠ ' + err.message + ' — try again.';
  } finally {
    busy = false;
    sendBtn.disabled = false;
    inputEl.focus();
    logEl.scrollTop = logEl.scrollHeight;
  }
});
</script>
</body>
</html>
